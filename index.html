<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7e9ec">
  <title>我們的婚禮｜2027</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">♡ OUR WEDDING</div>
    <div class="subtitle">2027.06.12 · 台北艾麗酒店 · 午宴</div>
  </header>

  <main>
    <div id="notice" class="notice">正在載入婚禮資料…</div>

    <div class="topline">
      <span id="identity">訪客 · 唯讀模式</span>
      <div class="actions">
        <button class="outline small" id="loginToggle">管理員登入</button>
        <button class="outline small" id="logout" hidden>登出</button>
      </div>
    </div>

    <section id="auth" class="panel" hidden>
      <h2>管理員登入</h2>
      <form id="login">
        <label>Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>密碼
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">登入</button>
      </form>
      <p class="muted">尚未設定密碼？可在 Supabase 郵件額度恢復後使用密碼重設信。</p>
      <button class="outline" id="reset">寄送密碼重設信</button>
      <div id="passwordSetup" hidden>
        <h3>設定新密碼</h3>
        <input id="newPassword" type="password" minlength="6" placeholder="至少 6 碼">
        <button id="setPassword">儲存新密碼</button>
      </div>
    </section>

    <nav id="tabs">
      <button data-tab="home" class="active">首頁</button>
      <button data-tab="tasks">待辦事項</button>
      <button data-tab="guests">賓客與桌次</button>
      <button data-tab="vendors">廠商管理</button>
      <button data-tab="schedule">婚禮流程</button>
      <button data-tab="gifts">禮金管理</button>
    </nav>

    <section id="page"></section>

    <footer>OUR WEDDING · 霧粉 × 米白</footer>
  </main>

  <dialog id="dialog">
    <form id="recordForm">
      <h2 id="dialogTitle"></h2>
      <div id="fields"></div>
      <div class="actions">
        <button type="submit">儲存</button>
        <button class="outline" type="button" id="cancel">取消</button>
        <button class="danger" type="button" id="delete" hidden>刪除</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=4" defer></script>
</body>
</html>
