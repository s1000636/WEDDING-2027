<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7e9ec"><title>我們的婚禮｜2027</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">♡ OUR WEDDING</div><div class="subtitle">2027.06.12 · 台北艾麗酒店 · 午宴</div></header>
<main><div id="notice" class="notice">正在連線…</div><section id="auth" class="panel"><h2>新人專屬登入</h2><p class="muted">只有受邀且已授權的新郎、新娘可以使用。</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="受邀的 Email"></label><label>密碼<input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="你的登入密碼"></label><button type="submit">登入</button></form><div class="actions"><button class="outline" id="magic">寄送 Email 登入連結</button><button class="outline" id="reset">忘記密碼／設定密碼</button></div><div id="passwordSetup" hidden><h3>設定新密碼</h3><input type="password" id="newPassword" minlength="6" placeholder="新密碼（至少 6 碼）"><button id="setPassword">儲存新密碼</button></div></section>
<section id="app" hidden><div class="topline"><span id="identity"></span><button class="outline small" id="logout">登出</button></div><nav id="tabs"><button data-tab="home" class="active">首頁</button><button data-tab="tasks">待辦事項</button><button data-tab="guests">賓客與桌次</button><button data-tab="vendors">廠商管理</button><button data-tab="schedule">婚禮流程</button><button data-tab="gifts">禮金管理</button></nav><div id="page"></div></section>
<footer>OUR WEDDING · 霧粉 × 米白</footer></main>
<dialog id="dialog"><form id="recordForm"><h2 id="dialogTitle"></h2><div id="fields"></div><div class="actions"><button type="submit">儲存</button><button class="outline" type="button" id="cancel">取消</button><button class="danger" type="button" id="delete" hidden>刪除</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js" defer></script></body></html>
